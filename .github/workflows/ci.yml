name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: agile
          POSTGRES_PASSWORD: agile
          POSTGRES_DB: agile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agile -d agile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agile:agile@localhost:5432/agile_test?schema=public
      JWT_ACCESS_SECRET: ci-secret-that-is-long-enough-to-satisfy-validation
      WEB_ORIGIN: http://localhost:3000
      NUXT_PUBLIC_API_BASE: http://localhost:4000/api/v1
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w @agile/api
      - run: npm run db:deploy -w @agile/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
